<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mercieca Recruitment Desk</title>
  <meta name="description" content="Mercieca recruitment desk: searches, job descriptions, job boards, pay check and ready-written messages for a PR and marketing agency.">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="canonical" href="https://www.tchworks.co.uk/mercieca-recruitment/">
  <style>
    :root{
      --ink:#111111;--muted:#5f5f5f;--line:#dedede;--paper:#ffffff;--soft:#f6f6f3;
      --red:#ff3340;--yellow:#f2f454;--aqua:#a8dcdf;--dark:#101010;--green:#176c4f;
      --shadow:0 10px 30px rgba(0,0,0,.07)
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,Helvetica,sans-serif}
    button,input,select,textarea{font:inherit;color:inherit}
    button,a{touch-action:manipulation}
    a{color:inherit}
    :focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}
    [tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
    .skip{position:absolute;left:-999px;top:0;background:#111;color:#fff;padding:10px 14px;z-index:100}
    .skip:focus{left:0}
    .wrap{max-width:1240px;margin:0 auto;padding:0 22px}

    header.top{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:30}
    .nav-row{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-weight:900;font-size:24px;letter-spacing:-1.5px;text-transform:uppercase;text-decoration:none}
    .brand span{display:inline-block;background:var(--red);padding:6px 9px}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

    .btn{border:0;border-radius:999px;padding:11px 18px;background:var(--dark);color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;min-height:44px}
    .btn:hover{opacity:.88}
    .btn.secondary{background:#fff;color:var(--ink);border:1px solid #bdbdbd}
    .btn.yellow{background:var(--yellow);color:#111}
    .btn.red{background:var(--red);color:#111}
    .btn.small{padding:7px 13px;min-height:36px;font-size:14px}
    .btn.danger{background:#fff;color:#9e1d1d;border:1px solid #d9a3a3}

    .shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0;max-width:1240px;margin:0 auto;align-items:start}
    nav#nav{position:sticky;top:69px;padding:20px 14px 20px 22px;align-self:start;max-height:calc(100vh - 69px);overflow:auto}
    nav#nav a{display:block;text-decoration:none;padding:10px 12px;border-radius:12px;margin-bottom:4px;border:1px solid transparent}
    nav#nav a strong{display:block;font-size:16px}
    nav#nav a span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
    nav#nav a:hover{background:var(--soft)}
    nav#nav a[aria-current="page"]{background:var(--yellow);border-color:#111}
    nav#nav a[aria-current="page"] span{color:#222}
    main#main{padding:24px 22px 70px;min-width:0;outline:0}

    h1{font-size:clamp(32px,4.6vw,54px);line-height:1;letter-spacing:-.04em;margin:0}
    h2{margin:0;font-size:23px;letter-spacing:-.025em}
    h3{margin:0;font-size:19px;letter-spacing:-.02em}
    .eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:800;margin:0 0 8px}
    .small:not(.btn){font-size:13.5px;color:var(--muted)}
    .muted{color:var(--muted)}
    .pagehelp{margin:10px 0 0;font-size:17px;max-width:760px}
    .pagehead{margin-bottom:22px}
    .pagehead h1{font-size:clamp(28px,3.2vw,40px);line-height:1.1}
    .section{margin-top:30px}
    .section>h2{margin-bottom:12px}

    .hero{background:linear-gradient(90deg,var(--yellow) 0 34%,var(--aqua) 34% 67%,var(--red) 67% 100%);padding:26px;border-radius:18px}
    .hero-panel{background:#fff;padding:28px;border:1px solid rgba(0,0,0,.14);box-shadow:var(--shadow);max-width:900px;border-radius:14px}
    .lede{font-size:18px;max-width:720px;margin:14px 0 0}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .chip{background:#111;color:#fff;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700}
    .chip.light{background:#f2f2ef;color:#111;border:1px solid #ddd}
    .chip.good{background:#e1f3ea;color:#0f4d36;border:1px solid #b8dcc9}
    .stats{display:flex;gap:26px;flex-wrap:wrap;margin:18px 0 4px}
    .stat b{display:block;font-size:30px;letter-spacing:-1px;line-height:1}
    .stat span{font-size:13px;color:var(--muted)}
    .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

    .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .tile{display:block;text-decoration:none;border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.04);min-height:112px}
    .tile:hover{border-color:#111;transform:translateY(-1px)}
    .tile .dot{display:block;width:28px;height:6px;border-radius:3px;background:var(--yellow);margin-bottom:12px}
    .tile:nth-child(3n+2) .dot{background:var(--aqua)}
    .tile:nth-child(3n) .dot{background:var(--red)}
    .tile strong{display:block;font-size:18px;letter-spacing:-.02em}
    .tile span.t{display:block;font-size:14px;color:var(--muted);margin-top:3px}

    .card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
    .card+.card{margin-top:14px}
    .list>.card+.card,.board-grid>.card+.card,.side>.card+.card{margin-top:0}
    .side{display:grid;gap:14px}
    .grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
    .side{position:sticky;top:90px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .list{display:grid;gap:12px}
    .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .row .grow{flex:1;min-width:220px}

    label.f{display:block;font-size:13.5px;font-weight:700;margin:12px 0 4px}
    input[type=text],input[type=url],input[type=email],input[type=number],input:not([type]),select,textarea{
      width:100%;border:1px solid #bdbdbd;border-radius:10px;background:#fff;padding:10px 12px
    }
    textarea{min-height:90px;resize:vertical}
    input[type=range]{width:100%;accent-color:#111}
    input[type=checkbox]{width:22px;height:22px;accent-color:#111;vertical-align:middle}
    .check{display:flex;gap:10px;align-items:center;font-weight:700}
    .range-row{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:12px 0 5px}
    .range-value{font-size:30px;font-weight:900;letter-spacing:-1px}

    .candidate{border:1px solid var(--line);border-radius:16px;padding:19px;background:#fff}
    .candidate-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
    .candidate-name{font-size:23px;font-weight:900;letter-spacing:-.025em;margin:0}
    .roleline{margin:2px 0 0;color:#333}
    .match{min-width:64px;text-align:center;padding:8px 10px;border-radius:10px;background:var(--soft);font-weight:900}
    .match.exact{background:var(--yellow)}
    .match.close{background:var(--aqua)}
    .why{margin:13px 0 0}
    .evidence{margin:10px 0 0;padding:10px 12px;background:var(--soft);border-radius:10px;font-size:14px}
    .source-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
    .source-link{font-weight:800;text-decoration:underline;text-underline-offset:2px}
    .controls{display:grid;grid-template-columns:170px 1fr;gap:10px;margin-top:16px}
    .scorebar{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
    .scorebar button{width:40px;height:40px;border-radius:10px;border:1px solid #aaa;background:#fff;font-weight:800;cursor:pointer}
    .scorebar button.on{background:#111;color:#fff;border-color:#111}
    .notes{grid-column:1/-1;min-height:68px}
    .candidate-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .panel{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
    .message{white-space:pre-wrap;background:#f3f3f0;padding:14px;border-radius:11px;margin-top:8px;overflow-wrap:anywhere}
    .qlist{padding-left:20px;margin:10px 0 0}
    .qlist li{margin:8px 0}
    .add-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-top:4px}
    .add-grid .full{grid-column:1/-1}

    .notice{padding:12px 14px;border-radius:12px;background:#fff4d6;margin-top:12px;font-size:14px}
    .privacy{padding:12px 14px;border-radius:12px;background:#edf7f2;margin-top:12px;font-size:14px}
    .err{color:#9e1d1d;font-size:14px;margin:8px 0 0;min-height:1em}
    .empty{padding:26px;border:2px dashed #cfcfcf;border-radius:16px;text-align:center}

    .search-row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
    .tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#eee;margin-right:6px}
    .tag.open{background:#e1f3ea;color:#0f4d36}
    .tag.closed{background:#eee;color:#555}
    .tag.pending{background:#fff4d6;color:#6b4a00}

    .jd-body{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:14px;margin-top:10px;font-size:15px;overflow-wrap:anywhere}
    .jd-edit textarea{min-height:360px;font-size:15px}
    .jd-more{margin-top:10px}.jd-more summary{cursor:pointer;font-weight:800;padding:6px 0}

    .board-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .board h3{margin-bottom:2px}
    .board .acct{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
    .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

    .ladder{margin-top:14px}
    .lad-row{display:grid;grid-template-columns:190px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #eee}
    .lad-row.on{background:#fffde0}
    .lad-track{position:relative;height:22px;background:#f1f1ee;border-radius:6px}
    .lad-bar{position:absolute;top:3px;height:16px;background:var(--aqua);border:1px solid #6aa9ad;border-radius:5px}
    .lad-row.on .lad-bar{background:var(--yellow);border-color:#111}
    .lad-line{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--red);z-index:2}
    .lad-wrap{position:relative}
    .result{font-size:19px;font-weight:700}

    .tpl-card textarea{min-height:230px;font-size:15px}
    .field-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
    .field-chips button{border:1px solid #bbb;background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:700;font-size:13px}

    .steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:14px}
    .steps li{counter-increment:s;display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
    .steps li::before{content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
    .steps li:nth-child(3n+2)::before{background:var(--aqua)}
    .steps li:nth-child(3n)::before{background:var(--red)}
    .steps strong{font-size:18px}
    .faq details{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:10px}
    .faq summary{cursor:pointer;font-weight:800;font-size:17px}
    .faq p{margin:10px 0 0}
    .kbd{display:inline-block;border:1px solid #999;border-bottom-width:3px;border-radius:6px;padding:0 7px;background:#fafafa;font-weight:700}

    #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
    #toast.show{opacity:1}
    footer{border-top:1px solid var(--line);padding:24px 0 42px;color:var(--muted);font-size:13px}
    .foot-row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .hidden{display:none!important}

    @media(max-width:1000px){
      .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
      .grid{grid-template-columns:1fr}.side{position:static;display:contents}
      .f-close{order:1}.f-where{order:2}.f-list{order:3}.f-add{order:4}.f-questions{order:5}.f-privacy{order:6}
      .grid>*{margin:0!important}
    }
    @media(max-width:900px){
      header.top{position:static}
      .shell{grid-template-columns:1fr}
      nav#nav{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);background:#fff;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
      nav#nav a{flex:0 0 auto;margin:0;padding:8px 14px}
      nav#nav a span{display:none}
      main#main{padding:18px 14px 60px}
      .controls{grid-template-columns:1fr}
      .two,.board-grid{grid-template-columns:1fr}
      .lad-row{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .wrap{padding:0 14px}
      .nav-row{flex-direction:column;align-items:flex-start;padding:12px 0}
      .top-actions{width:100%}.top-actions .btn{flex:1;min-height:40px;padding:8px 12px}.top-actions .long{display:none}
      .nav-row{gap:10px}
      .tiles{grid-template-columns:1fr 1fr!important;gap:10px}.tile{min-height:0;padding:14px}
      .candidate-head{grid-template-columns:1fr}.match{justify-self:start}
      .add-grid{grid-template-columns:1fr}.add-grid .full{grid-column:auto}
      .hero{padding:12px}.hero-panel{padding:20px}
    }
  </style>
</head>

  function payResultHtml(){
    var p = state.pay, sec = PAY[p.sector], idx = LEVELS.indexOf(p.level);
    var row = sec.rows[idx], lo = row[0] * 1000, hi = row[1] * 1000, offer = parseMoney(p.offer);
    var shown = sec.rows;
    var scaleMin = Math.floor(Math.min.apply(null, shown.map(function(r){ return r[0]; })) * 0.85 / 5) * 5000, scaleMax = Math.max.apply(null, shown.map(function(r){ return r[1]; })) * 1000 * 1.05;
    function pct(v){ return Math.max(0, Math.min(100, (v - scaleMin) / (scaleMax - scaleMin) * 100)); }
    var text = "Market range for " + p.level + " (" + sec.label + "): " + money(lo) + " to " + money(hi) + ".";
    var where = "";
    if(offer){
      if(offer < lo) where = "Your figure of " + money(offer) + " is " + money(lo - offer) + " below the bottom of this range. You may find it hard to attract people.";
      else if(offer > hi) where = "Your figure of " + money(offer) + " is " + money(offer - hi) + " above the top of this range. That should attract strong people.";
      else {
        var share = (offer - lo) / (hi - lo);
        where = "Your figure of " + money(offer) + " sits in the " + (share < 0.34 ? "lower third" : share < 0.67 ? "middle" : "upper third") + " of the range (" + Math.round(share * 100) + "% of the way up).";
      }
    }
    var html = '<p class="result">' + esc(text) + '</p>' + (where ? '<p class="result" style="color:#0f4d36">' + esc(where) + '</p>' : '<p class="small">Type a salary above to see where it sits.</p>');
    html += '<div class="ladder lad-wrap" aria-label="Salary ranges for each level">';
    shown.forEach(function(r, i){
      var l = r[0] * 1000, h = r[1] * 1000;
      html += '<div class="lad-row' + (i === idx ? " on" : "") + '"><div><strong>' + esc(LEVELS[i]) + '</strong></div><div class="lad-track"><div class="lad-bar" style="left:' + pct(l).toFixed(1) + '%;width:' + Math.max(1.5, pct(h) - pct(l)).toFixed(1) + '%"></div>' +
        (offer ? '<div class="lad-line" style="left:' + pct(offer).toFixed(1) + '%" title="Your figure"></div>' : '') + '</div><div class="small">' + money(l) + ' to ' + money(h) + '</div></div>';
    });
    html += '</div>' + (offer ? '<p class="small">The red line is your figure.</p>' : '');
    return html;
  }

  function exportCsv(){
    var s = currentSearch();
    function cell(v){
      var t = String(v == null ? "" : v);
      if(/^[=+\-@\t\r]/.test(t)) t = "'" + t;
      return '"' + t.replace(/"/g,'""') + '"';
    }
    var rows = [["Name","Title","Employer","Location","Match","Status","Rating","Notes","CV link","Source URL","Verified"]];
    candidatesOf(s).forEach(function(c){ var w = workOf(c.id); rows.push([c.name,c.title,c.employer,c.location || "",c.match,w.status,w.rating,w.notes,w.cvUrl,c.sourceUrl,c.verified || "manual"]); });
    download("mercieca-" + s.title.toLowerCase().replace(/[^a-z0-9]+/g,"-") + "-shortlist.csv","text/csv;charset=utf-8", rows.map(function(r){ return r.map(cell).join(","); }).join("\r\n"));
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]"); if(!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id"), s = currentSearch();
    if(act === "skip"){ e.preventDefault(); $("#main").focus(); return; }
    if(act === "copy-link"){ copyText(CANONICAL_URL, el); return; }
    if(act === "copy"){ copyText(el.getAttribute("data-text") || "", el); return; }
    if(act === "open-search"){ state.currentId = id; save(); return; }
    if(act === "pay-for"){ state.pay.level = el.getAttribute("data-level"); save(); return; }
    if(act === "export-csv"){ exportCsv(); return; }
    if(act === "export-backup"){ exportBackup(); return; }
    if(act === "import-backup"){ $("#importFile").click(); return; }
    if(act === "score"){
      var w = workOf(id), n = Number(el.getAttribute("data-n")); w.rating = w.rating === n ? 0 : n; touch(s); save(); renderCandidates(); return;
    }
    if(act === "contact"){ var wc = workOf(id); wc.open = wc.open === "contact" ? "" : "contact"; save(); renderCandidates(); return; }
    if(act === "copy-msg"){
      var c = candidatesOf(s).filter(function(x){ return x.id === id; })[0]; if(!c) return;
      var w2 = workOf(id), tid = ownKey(state.templates, w2.tpl) ? w2.tpl : "t-call";
      copyText(fill(state.templates[tid], c, s), el); return;
    }
    if(act === "remove-cand"){
      if(window.confirm("Remove this person from the sheet?")){ s.custom = s.custom.filter(function(x){ return x.id !== id; }); delete state.work[id]; touch(s); save(); renderCandidates(); renderWhere(); }
      return;
    }
    if(act === "dup-search"){
      var src = state.searches.filter(function(x){ return x.id === id; })[0]; if(!src) return;
      var copy = normSearch(Object.assign({},src,{id:uid("sch"),created:now(),updated:now(),status:"open",custom:[]}));
      copy.title = src.title; state.searches.push(copy); state.currentId = copy.id; save(); toast("Copied. The new search starts with an empty sheet."); go("find"); return;
    }
    if(act === "toggle-search"){
      var t = state.searches.filter(function(x){ return x.id === id; })[0]; if(t){ t.status = t.status === "open" ? "closed" : "open"; touch(t); save(); render(); } return;
    }
    if(act === "del-search"){
      if(window.confirm("Delete this search and the people on it? This cannot be undone.")){
        var gone = state.searches.filter(function(x){ return x.id === id; })[0];
        if(gone) gone.custom.forEach(function(c){ delete state.work[c.id]; });
        state.searches = state.searches.filter(function(x){ return x.id !== id; });
        if(!state.searches.length) state.searches.push(defaultSearch());
        if(state.currentId === id) state.currentId = state.searches[0].id;
        save(); render();
      }
      return;
    }
    if(act === "jd-edit"){ ui.jdEdit = ui.jdEdit === id ? "" : id; render(); return; }
    if(act === "jd-save"){
      var j = jdById(id); if(!j) return;
      var tt = str($("#jdE-t").value.trim(),120); if(!tt){ toast("Please give the role a title"); return; }
      var lv = $("#jdE-l").value;
      if(tt !== j.title && lv === j.level && levelFromTitle(tt)) lv = levelFromTitle(tt);
      j.title = tt; j.level = LEVELS.indexOf(lv) > -1 ? lv : ""; j.body = str($("#jdE-b").value,12000);
      j.questions = $("#jdE-q").value.split("\n").map(function(q){ return str(q.trim(),400); }).filter(Boolean).slice(0,12);
      ui.jdEdit = ""; save(); render(); toast("Saved"); return;
    }
    if(act === "jd-del"){
      if(window.confirm("Delete this job description?")){ state.jds = state.jds.filter(function(x){ return x.id !== id; }); ui.jdEdit = ""; save(); render(); }
      return;
    }
    if(act === "jd-copy"){ var jc = jdById(id); if(jc) copyText(jc.title + "\n\n" + jc.body, el); return; }
    if(act === "jd-use"){ ui.newFrom = id; go("new"); return; }
    if(act === "jd-restore"){
      JD_SEEDS.forEach(function(sd){ if(!jdById(sd.id)) state.jds.push({id:sd.id,title:sd.title,level:sd.level,body:sd.body,questions:sd.questions.slice(),seed:true}); });
      save(); render(); return;
    }
    if(act === "board-del"){
      if(window.confirm("Remove this board from your list?")){ state.customBoards = state.customBoards.filter(function(x){ return x.id !== id; }); delete state.boards[id]; save(); render(); }
      return;
    }
    if(act === "tpl-insert"){
      var ta = $("#tpl-" + id); if(!ta) return;
      var f = el.getAttribute("data-field"), a = ta.selectionStart, b = ta.selectionEnd;
      ta.value = ta.value.slice(0,a) + f + ta.value.slice(b); ta.focus(); ta.selectionStart = ta.selectionEnd = a + f.length;
      state.templates[id] = ta.value; save(); return;
    }
    if(act === "tpl-reset"){
      var seed = TPL_SEEDS.filter(function(x){ return x.id === id; })[0];
      if(seed && window.confirm("Put back the original wording for this message?")){ state.templates[id] = seed.text; save(); render(); }
      return;
    }
    if(act === "tpl-copy"){ copyText(fill(state.templates[id], {name:"Sam Example",employer:"Example Agency"}, s), el); return; }
  });

  function importBackup(input){
    var f = input.files && input.files[0]; if(!f) return;
    if(f.size > 2 * 1024 * 1024){ toast("That file is too big to be a backup"); input.value = ""; return; }
    var r = new FileReader();
    r.onload = function(){
      try{
        var raw = JSON.parse(String(r.result));
        if(!raw || typeof raw !== "object" || Array.isArray(raw) || raw.v !== 2 || !Array.isArray(raw.searches)) throw new Error("not a desk backup");
        var next = normalize(raw);
        if(window.confirm("Replace everything on this computer with the backup file?")){ state = next; save(); render(true); toast("Backup restored"); }
      }catch(err){ toast("That file does not look like a backup from this desk"); }
      input.value = "";
    };
    r.readAsText(f);
  }

  render(false);
})();
</script>
