<style>body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2a1a1f;background:#fff8f1}.w{max-width:1100px;margin:0 auto;padding:20px 16px}h1{font:700 30px Georgia,serif;margin:8px 0 12px}
form{display:flex;max-width:620px}input{flex:1;min-width:0;font:inherit;padding:12px;border:2px solid #2a1a1f;border-radius:10px 0 0 10px}button{font:inherit;font-weight:700;padding:0 18px;border:2px solid #2a1a1f;border-radius:0 10px 10px 0;background:#c23a1d;color:#fff}
.f{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.f button{border-radius:999px;padding:5px 12px;background:#fff;color:#2a1a1f;border:1.5px solid #2a1a1f33;font-size:14px}.f button[aria-pressed=true]{background:#2a1a1f;color:#fff}
#n{color:#5b4a4f;margin:6px 0 12px}ol{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}li a{display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;text-decoration:none;color:#2a1a1f;height:100%}
li img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f5ece4}li b{padding:8px 12px 0;font-size:15px}li small{padding:2px 12px 10px;color:#5b4a4f}li em{font-style:normal;font-size:12px;font-weight:700;color:#8a2a14;padding:8px 12px 0;text-transform:uppercase;letter-spacing:.04em}</style></head><body><style>.tbar{background:#1f1720;color:#fff;font:500 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;position:relative;z-index:50}.tbar-in{max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.tbar-brand{color:#fff;text-decoration:none;font-weight:800;font-size:17px;letter-spacing:.01em;white-space:nowrap}.tbar-brand b{color:#ffb4a2}.tbar nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}.tbar nav::-webkit-scrollbar{display:none}.tbar nav a{color:#f3ece7;text-decoration:none;padding:7px 9px;border-radius:7px;white-space:nowrap}.tbar nav a:hover{background:#ffffff1f}.tbar nav a[aria-current]{background:#fff;color:#1f1720}.tbar-s{display:flex;flex:0 1 260px;min-width:180px}.tbar-s input{flex:1;min-width:0;border:0;border-radius:8px 0 0 8px;padding:8px 10px;font:inherit;color:#1f1720;background:#fff}.tbar-s button{border:0;border-radius:0 8px 8px 0;padding:8px 12px;background:#ffb4a2;color:#1f1720;font:inherit;font-weight:700;cursor:pointer}@media(max-width:720px){.tbar-in{gap:8px}.tbar nav{order:3;flex-basis:100%}.tbar-s{flex:1 1 140px}}main p a:not([class]),.crumbs a{text-decoration:underline}</style><div class="tbar"><div class="tbar-in"><a class="tbar-brand" href="/">TCH<b>Works</b></a><nav aria-label="Shop sections"><a href="/cards/">Cards</a><a href="/t-shirts/">T-shirts</a><a href="/hoodies/">Hoodies</a><a href="/sweatshirts/">Sweatshirts</a><a href="/mugs/">Mugs</a><a href="/personalised/">Personalised</a><a href="/shop/">Templates</a></nav><form class="tbar-s" action="/search/" method="get" role="search"><input type="search" name="q" placeholder="Search cards, tees, templates" aria-label="Search the shop"><button type="submit">Search</button></form></div></div>
<main class="w"><h1>Search the shop</h1><form action="/search/" method="get" role="search"><input id="q" type="search" name="q" aria-label="Search cards, tees, mugs and templates" placeholder="e.g. 40th birthday, dad, meal planner"><button type="submit">Search</button></form>
<div class="f" id="f" role="group" aria-label="Filter results"></div><p id="n" aria-live="polite">Type a word to search cards, clothing, mugs and templates.</p><ol id="r"></ol></main>
<script>(function(){var q=new URLSearchParams(location.search).get('q')||'',I=document.getElementById('q'),R=document.getElementById('r'),N=document.getElementById('n'),F=document.getElementById('f'),D=null,T='';I.value=q;
var SYN={tee:'t-shirt',tshirt:'t-shirt',tees:'t-shirt',shirt:'t-shirt',hoody:'hoodie',jumper:'sweatshirt',cup:'mug',planner:'planner',bday:'birthday',xmas:'christmas',mum:'mum',mom:'mum',father:'dad',mother:'mum',anniv:'anniversary'};
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9£ ]+/g,' ')}
function words(s){return norm(s).split(' ').filter(Boolean).map(function(w){return SYN[w]||w.replace(/s$/,'')})}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function run(){var ws=words(I.value);if(!ws.length){R.innerHTML='';N.textContent='Type a word to search cards, clothing, mugs and templates.';F.innerHTML='';return}
var hits=[];D.forEach(function(d){var t=norm(d[0]+' '+d[2]),x=norm(d[3]),s=0,ok=true;ws.forEach(function(w){var a=t.indexOf(w),b=x.indexOf(w);if(a<0&&b<0)ok=false;else s+=(a>=0?3:1)+(t.indexOf(' '+w)>=0||t.indexOf(w)==0?1:0)});if(ok)hits.push([s-(d[2]=='Card'?0.1:0),d])});
hits.sort(function(a,b){return b[0]-a[0]});var types={};hits.forEach(function(h){types[h[1][2]]=(types[h[1][2]]||0)+1});
F.innerHTML=['All'].concat(Object.keys(types)).map(function(k){return '<button type="button" aria-pressed="'+((T||'All')==k)+'" data-t="'+k+'">'+k+(k=='All'?' ('+hits.length+')':' ('+types[k]+')')+'</button>'}).join('');
var show=hits.filter(function(h){return !T||T=='All'||h[1][2]==T}).slice(0,60);N.textContent=hits.length?hits.length+' result'+(hits.length>1?'s':'')+' for “'+I.value+'”':'No results for “'+I.value+'”. Try a simpler word, like birthday, dad or planner.';
R.innerHTML=show.map(function(h){var d=h[1];return '<li><a href="'+d[1]+'">'+(d[4]?'<img src="'+d[4]+'" alt="" loading="lazy" width="400" height="300">':'')+'<em>'+esc(d[2])+'</em><b>'+esc(d[0])+'</b><small>'+esc(d[3])+'</small></a></li>'}).join('')}
F.addEventListener('click',function(e){var b=e.target.closest('button');if(b){T=b.dataset.t;run()}});
I.addEventListener('input',function(){T='';if(D)run()});document.querySelector('main form').addEventListener('submit',function(e){e.preventDefault();history.replaceState(null,'','?q='+encodeURIComponent(I.value));run()});
fetch('/search/index.json').then(function(r){return r.json()}).then(function(d){D=d;run()})})()</script></body></html>
