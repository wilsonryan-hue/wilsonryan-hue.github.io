<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Treun Roc Connect</title>
    <link rel="icon" href="./tr-logo.svg" />
    <style>
      html, body { background:#0a0a0a; color:#f3f0e6; margin:0; font-family: Georgia, "Palatino Linotype", serif; }
      main { min-height:100vh; display:grid; place-items:center; padding:2rem; text-align:center; }
      .mark { width:72px; height:72px; margin:0 auto 1rem; border-radius:8px; background:#121212; border:1px solid #2a2a2a; display:grid; place-items:center; color:#d4af37; letter-spacing:.2em; font-size:.7rem; }
      h1 { color:#d4af37; font-weight:normal; font-size:1.4rem; margin:0 0 .5rem; }
      p { max-width:28rem; margin:0 auto; color:#c4c0b4; line-height:1.5; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="mark">TR</div>
        <h1>Treun Roc Connect</h1>
        <p>This public door is closed. Staff sign-in is not available here.</p>
      </div>
    </main>
  </body>
</html>
